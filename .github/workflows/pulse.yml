name: pulse

# 매일 pulse.json을 갱신해 커밋한다.
# push가 발생하면 Cloudflare Pages가 자동으로 리빌드 → 사이트가 매일 새 파형으로 깨어난다.
on:
  schedule:
    - cron: '17 21 * * *' # 매일 06:17 KST (UTC 21:17)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-pulse.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit if changed
        run: |
          git config user.name 'pulse-bot'
          git config user.email 'actions@github.com'
          git add src/data/pulse.json
          git diff --staged --quiet || (git commit -m 'pulse: daily update' && git push)
